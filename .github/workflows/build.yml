name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Application Syntax
        run: node --check server.js

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Application Test
        run: |
          node --disable-warning=ExperimentalWarning server.js > app.log 2>&1 &
          sleep 5
          curl --fail http://localhost:3000/health || exit 1
          pkill -f "node server.js" || true

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t node-app:latest .

      - name: Run Container in Background
        run: |
          docker run -d --name node-app-container -p 3000:3000 node-app:latest

      - name: Verify Running Container
        run: |
          sleep 5
          docker ps
          curl --fail http://localhost:3000/health || exit 1

      - name: Stop and Remove Container
        run: |
          docker stop node-app-container
          docker rm node-app-container